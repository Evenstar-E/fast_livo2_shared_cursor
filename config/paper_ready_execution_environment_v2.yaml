rationale: >-
  The unpinned P2G development run exhibited catastrophic pre-fault branch
  divergence at 0.5x. The predeclared P2H discriminator used disjoint physical
  cores and reduced the 70-second branch difference from hundreds of metres to
  0.402 m while reducing total peak HWM to 3.48 GiB. This resource assignment
  is fixed before any held-out execution and is part of reproducibility, not a
  result-dependent selector threshold.
change_control: >-
  Any host or CPU-set change after held-out execution starts must be recorded
  as a new environment version. Results from different versions are reported
  separately unless equivalence is established before examining fault metrics.
amendment_note: >-
  CPU, host, playback, detector, recovery and selector settings are unchanged.
  v2 only corrects the terminal lifecycle path exposed by v1 when required map
  persistence was enabled; qualification evidence is development-only.
