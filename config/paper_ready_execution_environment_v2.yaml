  run_trials_sequentially: true
  playback_rate: 0.5
  omp_num_threads: 4
  omp_proc_bind: true
  incumbent_cpu_set: [0, 2, 4, 6]
  candidate_cpu_set: [8, 10, 12, 14]
  mapper_shutdown_order: [candidate, incumbent]
