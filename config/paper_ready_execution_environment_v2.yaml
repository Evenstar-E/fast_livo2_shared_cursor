amends: paper_ready_execution_environment_v1
host:
  operating_system: Ubuntu 20.04
  ros_distribution: noetic
  logical_cpus: 32
  physical_cores: 16
  cpu_model: 13th Gen Intel Core i9-13900HX
  filesystem_capacity_gib: 1007
build:
  type: Release
  compiler_parallel_jobs: 32
